<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SplitIt</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f6f5f1; color: #171717; margin: 0; padding: 20px; }
  main { max-width: 420px; margin: 0 auto; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
  button { width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 8px; background: #17604a; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  #result { margin-top: 16px; padding: 14px; background: #fff; border-radius: 8px; min-height: 24px; }
</style>
</head>
<body>
<main>
  <h1>SplitIt</h1>
  <form id="form">
    <label for="event">What was it?</label>
    <input id="event" value="Pizza night">
    <label for="total">Total bill</label>
    <input id="total" type="number" step="0.01" value="100">
    <label for="people">Number of people</label>
    <input id="people" type="number" value="3">
    <button>Split it</button>
  </form>
  <div id="result" aria-live="polite"></div>
</main>
<script>
  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = document.getElementById("event").value;
    var total = Number(document.getElementById("total").value);
    var people = Number(document.getElementById("people").value);
    var share = (total / people).toFixed(2);
    document.getElementById("result").innerHTML =
      "<strong>" + name + "</strong><br>Each person pays " + share +
      "<br>Total collected: " + (share * people).toFixed(2);
  });
</script>
</body>
</html>
